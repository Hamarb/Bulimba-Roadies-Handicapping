import os
import requests
import pandas as pd
import gspread
from google.oauth2.service_account import Credentials

# --- 1. CONFIGURATION & AUTHENTICATION ---
SCOPES = [
    "https://www.googleapis.com/auth/spreadsheets",
    "https://www.googleapis.com/auth/drive"
]

def get_strava_access_token():
    """Refreshes and returns a valid Strava API access token."""
    payload = {
        'client_id': os.getenv("STRAVA_CLIENT_ID"),
        'client_secret': os.getenv("STRAVA_CLIENT_SECRET"),
        'refresh_token': os.getenv("STRAVA_REFRESH_TOKEN"),
        'grant_type': "refresh_token"
    }
    response = requests.post("https://www.strava.com/oauth/token", data=payload)
    response.raise_for_status()
    return response.json()['access_token']

def init_google_sheets():
    """Initializes the gspread client and returns the 'Strava' worksheet."""
    # If running locally via GitHub Actions, credentials can come from environment variables or secrets
    creds_dict = {
        "type": os.getenv("GCP_TYPE"),
        "project_id": os.getenv("GCP_PROJECT_ID"),
        "private_key_id": os.getenv("GCP_PRIVATE_KEY_ID"),
        "private_key": os.getenv("GCP_PRIVATE_KEY", "").replace("\\n", "\n"),
        "client_email": os.getenv("GCP_CLIENT_EMAIL"),
        "client_id": os.getenv("GCP_CLIENT_ID_GCP"),
        "auth_uri": "https://accounts.google.com/oauth/v2/auth",
        "token_uri": "https://oauth2.googleapis.com/token",
        "auth_provider_x509_cert_url": "https://www.googleapis.com/oauth2/v1/certs",
        "client_x509_cert_url": os.getenv("GCP_CERT_URL")
    }
    
    # Alternatively, if testing locally with Streamlit secrets, use st.secrets instead of os.getenv
    creds = Credentials.from_service_account_info(creds_dict, scopes=SCOPES)
    client = gspread.authorize(creds)
    
    # Open spreadsheet and select the new 'Strava' test tab
    spreadsheet_url = os.getenv("GSHEETS_SPREADSHEET_URL")
    sheet = client.open_by_url(spreadsheet_url).worksheet("Strava")
    return sheet

# --- 2. MAIN SYNC LOGIC ---
def pull_and_push_strava_data():
    access_token = get_strava_access_token()
    headers = {'Authorization': f'Bearer {access_token}'}
    
    # Example endpoint: Fetching club activities or segment leaderboard details 
    # (Update this endpoint depending on what specific data you want to pull)
    club_id = os.getenv("STRAVA_CLUB_ID") # Add your club ID to secrets if needed
    url = f"https://www.strava.com/api/v3/clubs/{club_id}/activities"
    
    response = requests.get(url, headers=headers)
    response.raise_for_status()
    activities = response.json()
    
    # Parse data to match your columns: Name, FTP (W), Segment Time (s), Delta Estimate, Segment, Date
    rows_to_insert = []
    for act in activities:
        athlete_name = f"{act.get('athlete', {}).get('firstname', '')} {act.get('athlete', {}).get('lastname', '')}".strip()
        moving_time = act.get('moving_time', 0)
        start_date = act.get('start_date', '')
        
        # Map into your specified schema structure
        rows_to_insert.append([
            athlete_name, 
            0,             # FTP placeholder if not pulled directly from activity
            moving_time,   # Segment Time (s)
            0,             # Delta Estimate placeholder
            "Strava API Sync", 
            start_date
        ])
    
    # Push data to Google Sheets "Strava" worksheet
    sheet = init_google_sheets()
    
    # Optional: Clear existing data rows (keeping header row 1) before writing fresh sync data
    sheet.batch_clear(["A2:F100"])
    
    if rows_to_insert:
        sheet.append_rows(rows_to_insert)
        print(f"Successfully pushed {len(rows_to_insert)} rows to the 'Strava' Google Sheets tab.")
    else:
        print("No new activities found to sync.")

if __name__ == "__main__":
    pull_and_push_strava_data()
