name: Cleanup Data
on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Cleanup Script
        run: |
          python -c "
          import pandas as pd
          from datetime import datetime, timedelta
          import os

          # 1. Clean manual_entries.csv
          if os.path.exists('manual_entries.csv'):
              df = pd.read_csv('manual_entries.csv')
              df['Date'] = pd.to_datetime(df['Date'])
              cutoff = datetime.now() - timedelta(days=45)
              df_clean = df[df['Date'] >= cutoff]
              df_clean.to_csv('manual_entries.csv', index=False)
          "
          # 2. Ensure faq_data.csv remains untouched (or add other logic if needed)
          # We don't need to 'clean' this, just ensure it exists
          if not os.path.exists('faq_data.csv'):
              pd.DataFrame(columns=['Question', 'Answer']).to_csv('faq_data.csv', index=False)
          "
      - name: Commit and Push
        run: |
          git config user.name 'github-actions'
          git config user.email 'github-actions@github.com'
          # Check if there are changes before committing
          if [[ -n $(git status -s) ]]; then
            git add manual_entries.csv
            git commit -m 'Auto-purge data older than 45 days'
            git push
          else
            echo "No data older than 45 days found. Nothing to push."
          fi
